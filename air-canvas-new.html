

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Air Canvas</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      text-align: center;
      font-family: Arial, sans-serif;
      color: white;
      background: #101426;
    }

    h1 {
      color: #55f5e8;
      margin-bottom: 8px;
    }

    p { color: #c4cbe0; }

    button, input {
      margin: 6px;
    }

    button {
      padding: 11px 16px;
      border: 0;
      border-radius: 9px;
      background: #55f5e8;
      color: #101426;
      font-weight: bold;
      cursor: pointer;
    }

    #stage {
      position: relative;
      width: min(95vw, 850px);
      margin: 18px auto;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      border: 2px solid #55f5e8;
      border-radius: 14px;
      background: #080b14;
    }

    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    video { z-index: 1; }
    canvas { z-index: 2; pointer-events: none; }

    #status { min-height: 24px; }
  </style>
</head>

<body>
  <h1>✨ AIR CANVAS</h1>
  <p>Draw in the air with your index finger!</p>

  <button id="start">Start Camera</button>
  <button id="clear">Clear Drawing</button>

  <label>
    Drawing color:
    <input type="color" id="color" value="#55f5e8">
  </label>

  <p id="status">Press Start Camera to begin.</p>

  <div id="stage">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const status = document.getElementById("status");
    const colorInput = document.getElementById("color");

    let camera = null;
    let previousPoint = null;
    let lastTime = 0;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      previousPoint = null;
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function drawResults(results) {
      if (!results.multiHandLandmarks ||
          results.multiHandLandmarks.length === 0) {
        previousPoint = null;
        return;
      }

      const hand = results.multiHandLandmarks[0];

      // Index fingertip and index finger base
      const tip = hand[8];
      const base = hand[5];

      // Draw only when the index finger is raised
      // and the other fingers are folded.
      const middleFolded = hand[12].y > hand[10].y;
      const ringFolded = hand[16].y > hand[14].y;
      const pinkyFolded = hand[20].y > hand[18].y;
      const indexRaised = tip.y < base.y;

      const drawing =
        indexRaised && middleFolded &&
        ringFolded && pinkyFolded;

      if (!drawing) {
        previousPoint = null;
        return;
      }

      const point = {
        x: (1 - tip.x) * canvas.width,
        y: tip.y * canvas.height
      };

      // Avoid huge lines when tracking jumps
      const now = performance.now();
      if (previousPoint && now - lastTime < 150) {
        ctx.strokeStyle = colorInput.value;
        ctx.lineWidth = 6;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.shadowColor = colorInput.value;
        ctx.shadowBlur = 8;

        ctx.beginPath();
        ctx.moveTo(previousPoint.x, previousPoint.y);
        ctx.lineTo(point.x, point.y);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      previousPoint = point;
      lastTime = now;
    }

    document.getElementById("clear").addEventListener("click", () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      previousPoint = null;
    });

    document.getElementById("start").addEventListener("click", async () => {
      try {
        if (!window.Hands || !window.Camera) {
          status.textContent =
            "Hand-tracking library failed to load. Check your internet connection.";
          return;
        }

        status.textContent = "Starting camera and hand tracking...";

        const hands = new Hands({
          locateFile: file =>
            `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
          maxNumHands: 1,
          modelComplexity: 1,
          minDetectionConfidence: 0.65,
          minTrackingConfidence: 0.6
        });

        hands.onResults(drawResults);

        camera = new Camera(video, {
          onFrame: async () => {
            await hands.send({ image: video });
          },
          width: 640,
          height: 480
        });

        await camera.start();

        status.textContent =
          "Camera ready! Raise your index finger and fold the others to draw.";
      } catch (error) {
        console.error(error);
        status.textContent =
          "Camera failed. Allow camera access and try again.";
      }
    });
  </script>
</body>
</html>
